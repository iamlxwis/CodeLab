name: Android APK
on:
  pull_request:
    paths:
      - 'app/**'
      - 'engine-*/**'
      - 'qa/**'
      - 'gradle/**'
      - 'gradlew'
      - '*.gradle.kts'
      - '.github/workflows/android.yml'
      - '.github/workflows/device.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'engine-*/**'
      - 'qa/**'
      - 'gradle/**'
      - 'gradlew'
      - '*.gradle.kts'
      - '.github/workflows/android.yml'
      - '.github/workflows/device.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish latest release after same-commit Android 15 smoke (main pushes publish automatically)'
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: android-${{ github.event.pull_request.head.ref || github.ref_name }}${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["reimagined-2.0","reimagined-2.1-refinement"]'), github.ref_name) && '-signed-upgrade' || '' }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      CODELAB_TEST_UPGRADE: ${{ contains(fromJSON('["reimagined-2.0","reimagined-2.1-refinement"]'), github.ref_name) && github.event_name == 'workflow_dispatch' }}
    steps:
      # Checkout is read-only; never persist a token that could commit as github-actions[bot].
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && contains(fromJSON('["reimagined-2.0","reimagined-2.1-refinement"]'), github.head_ref) && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assign increasing release version code
        run: echo "CODELAB_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Configure optional stable release signing
        env:
          CODELAB_KEYSTORE_B64: ${{ secrets.CODELAB_KEYSTORE_B64 }}
          CODELAB_KEYSTORE_PASSWORD: ${{ secrets.CODELAB_KEYSTORE_PASSWORD }}
          CODELAB_KEY_ALIAS: ${{ secrets.CODELAB_KEY_ALIAS }}
          CODELAB_KEY_PASSWORD: ${{ secrets.CODELAB_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CODELAB_KEYSTORE_B64" && -n "$CODELAB_KEYSTORE_PASSWORD" && -n "$CODELAB_KEY_ALIAS" && -n "$CODELAB_KEY_PASSWORD" ]]; then
            echo "$CODELAB_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/codelab-release.jks"
            echo "CODELAB_KEYSTORE_FILE=$RUNNER_TEMP/codelab-release.jks" >> "$GITHUB_ENV"
            echo "CODELAB_SIGNING_MODE=production" >> "$GITHUB_ENV"
          else
            if [[ -n "$CODELAB_KEYSTORE_B64$CODELAB_KEYSTORE_PASSWORD$CODELAB_KEY_ALIAS$CODELAB_KEY_PASSWORD" ]]; then
              echo "::error::Release signing is partially configured. All four secrets are required."
              exit 1
            fi
            echo "::warning::No stable signing key configured; in-place updates cannot be guaranteed."
            echo "CODELAB_SIGNING_MODE=fallback-debug" >> "$GITHUB_ENV"
          fi
      - name: Static security regression gate
        run: python3 qa/security_gate.py
      - name: Test same-commit release gate behavior
        run: python3 -m unittest discover -s qa -p 'test_release_gate.py' -v
      - name: Test production publication guards
        run: python3 -m unittest discover -s qa -p 'test_production_signing_gate.py' -v && python3 -m unittest discover -s qa -p 'test_release_acceptance.py' -v && python3 -m unittest discover -s qa -p 'test_device_suite.py' -v
      - name: Test workflow artifact safety
        run: python3 -m unittest discover -s qa -p 'test_artifact_layout.py' -v
      - name: Build release, test, lint, and coverage report
        env:
          CODELAB_KEYSTORE_PASSWORD: ${{ secrets.CODELAB_KEYSTORE_PASSWORD }}
          CODELAB_KEY_ALIAS: ${{ secrets.CODELAB_KEY_ALIAS }}
          CODELAB_KEY_PASSWORD: ${{ secrets.CODELAB_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # Recheck only transient Maven Central throttling; never mask real Gradle failures.
          for attempt in 1 2 3; do
            if bash gradlew --no-daemon :app:assembleRelease :engine-python:assembleRelease :engine-js:assembleRelease :engine-lua:assembleRelease :engine-java:assembleRelease :engine-ts:assembleRelease :engine-sql:assembleRelease :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:lintDebug > gradle-release-build.log 2>&1; then
              cat gradle-release-build.log
              exit 0
            fi
            cat gradle-release-build.log
            if ! grep -Eiq 'status code 429|HTTP 429|Too Many Requests' gradle-release-build.log; then
              exit 1
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Maven server returned HTTP 429 after three attempts."
              exit 1
            fi
            echo "::warning::Maven repository HTTP 429 on attempt $attempt/3; retrying with backoff."
            sleep $((attempt * 40))
          done
      - name: Exercise packaged TypeScript transpiler (offline)
        run: node qa/typescript_compiler_smoke.js engine-ts/build/outputs/apk/release/engine-ts-release.apk
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk'
      - name: Verify all optional runtime signatures
        run: |
          for apk in engine-python engine-js engine-lua engine-java engine-ts engine-sql; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk/build/outputs/apk/release/$apk-release.apk"
          done
      - name: Enforce actual production signing certificate
        if: env.CODELAB_TEST_UPGRADE == 'true' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)))
        env:
          CODELAB_KEYSTORE_PASSWORD: ${{ secrets.CODELAB_KEYSTORE_PASSWORD }}
          CODELAB_KEY_ALIAS: ${{ secrets.CODELAB_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CODELAB_SIGNING_MODE" == "production" ]]; then
            [[ -f "$CODELAB_KEYSTORE_FILE" ]] || { echo "::error::Configured keystore missing"; exit 1; }
            expected="$(keytool -exportcert -rfc -keystore "$CODELAB_KEYSTORE_FILE" \
              -storepass "$CODELAB_KEYSTORE_PASSWORD" -alias "$CODELAB_KEY_ALIAS" |
              openssl x509 -noout -fingerprint -sha256 |
              cut -d= -f2 | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
            signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
            actual_editor="$("$signer" verify --print-certs app/build/outputs/apk/release/app-release.apk |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
            for pack in engine-python engine-js engine-lua engine-java engine-ts engine-sql; do
              actual_pack="$("$signer" verify --print-certs "$pack/build/outputs/apk/release/$pack-release.apk" |
                sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
              if [[ -z "$expected" || "$actual_editor" != "$expected" || "$actual_pack" != "$expected" ]]; then
                echo "::error::Release APK signer mismatch for $pack"; exit 1
              fi
            done
            if [[ -z "$expected" || "$actual_editor" != "$expected" ]]; then
              echo "::error::Release APK signer does not match the configured permanent keystore; refusing to publish."
              exit 1
            fi
            echo "Editor and Python release certificates match the existing production keystore."
          else
            echo "::error::Production publication requires the permanent signing key; debug-signed artifacts cannot be published."
            exit 1
          fi
      - name: Audit upgrade signing compatibility
        if: env.CODELAB_TEST_UPGRADE == 'true' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          signing_sha256() {
            "$signer" verify --print-certs "$1" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1
          }
          editor_cert="$(signing_sha256 app/build/outputs/apk/release/app-release.apk)"
          for pack in engine-python engine-js engine-lua engine-java engine-ts engine-sql; do
            pack_cert="$(signing_sha256 "$pack/build/outputs/apk/release/$pack-release.apk")"
            if [[ -z "$editor_cert" || "$editor_cert" != "$pack_cert" ]]; then
              echo "::error::CodeLab and $pack APKs must use the same signer."; exit 1
            fi
          done
          echo "CODELAB_SIGNER_SHA256=$editor_cert" >> "$GITHUB_ENV"
          echo "CODELAB_UPGRADE_COMPATIBILITY=no_previous" >> "$GITHUB_ENV"
          echo "CODELAB_UPGRADE_TEST=not_run" >> "$GITHUB_ENV"
          if gh release view latest >/dev/null 2>&1; then
            mkdir -p prior-apk
            gh release download latest --pattern CodeLab.apk --dir prior-apk
            gh release download latest --pattern CodeLab-Python.apk --dir prior-apk || true
            gh release download latest --pattern CodeLab-build-info.txt --dir prior-apk || true
            if [[ "$CODELAB_SIGNING_MODE" != "production" ]] &&
               grep -q '^Signing mode: production$' prior-apk/CodeLab-build-info.txt 2>/dev/null; then
              echo "::error::Refusing to replace a production-signed release with a fallback-debug APK."
              exit 1
            fi
            prior_cert="$(signing_sha256 prior-apk/CodeLab.apk || true)"
            # Protect production update compatibility.
            if grep -q '^Signing mode: production$' prior-apk/CodeLab-build-info.txt 2>/dev/null &&
               [[ "$prior_cert" != "$editor_cert" ]]; then
              echo "::error::Production signing key changed since the prior published release; refusing to publish."
              exit 1
            fi
            if [[ -n "$prior_cert" && "$prior_cert" == "$editor_cert" ]]; then
              echo "CODELAB_UPGRADE_COMPATIBILITY=compatible" >> "$GITHUB_ENV"
              echo "Existing latest release has the same Android signing certificate."
            else
              echo "CODELAB_UPGRADE_COMPATIBILITY=signature_changed" >> "$GITHUB_ENV"
              echo "::warning title=CodeLab upgrade cannot replace prior installation::Signing certificate differs from the previously published APK. Back up projects before uninstalling; configure stable GitHub Actions signing secrets."
            fi
          fi
      # Production upgrade verification runs on release pushes; preserve the same-SHA
      # release gate below. GitHub Release assets remain individual APKs because
      # the in-app module manager downloads those exact public asset filenames.
      - name: Release build memory before production upgrade verification
        if: env.CODELAB_TEST_UPGRADE == 'true' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)))
        run: bash gradlew --stop
      - name: Enable acceleration for production upgrade verification
        if: env.CODELAB_TEST_UPGRADE == 'true' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)))
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify production upgrade and preserved data on Android 15
        if: env.CODELAB_TEST_UPGRADE == 'true' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)))
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -feature -Vulkan
          disable-animations: true
          script: python3 qa/production_upgrade_smoke.py
      - name: Record verified production upgrade
        if: env.CODELAB_TEST_UPGRADE == 'true' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)))
        run: |
          test -s qa-results/production-upgrade-api-35.txt
          echo "CODELAB_UPGRADE_TEST=passed_api35" >> "$GITHUB_ENV"
      - name: Prepare three user-facing downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact-out/app artifact-out/packs
          cp app/build/outputs/apk/release/app-release.apk artifact-out/app/CodeLab.apk
          cp engine-python/build/outputs/apk/release/engine-python-release.apk artifact-out/packs/CodeLab-Python.apk
          cp engine-js/build/outputs/apk/release/engine-js-release.apk artifact-out/packs/CodeLab-JavaScript.apk
          cp engine-lua/build/outputs/apk/release/engine-lua-release.apk artifact-out/packs/CodeLab-Lua.apk
          cp engine-java/build/outputs/apk/release/engine-java-release.apk artifact-out/packs/CodeLab-Java.apk
          cp engine-ts/build/outputs/apk/release/engine-ts-release.apk artifact-out/packs/CodeLab-TypeScript.apk
          cp engine-sql/build/outputs/apk/release/engine-sql-release.apk artifact-out/packs/CodeLab-SQLite.apk
          (cd artifact-out/packs && sha256sum CodeLab-*.apk > SHA256SUMS.txt)
          test "$(find artifact-out/packs -maxdepth 1 -name 'CodeLab-*.apk' | wc -l)" -eq 6
      - name: Upload app APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeLab-APK
          path: artifact-out/app/CodeLab.apk
          if-no-files-found: error
          retention-days: 90
      - name: Upload six optional offline packs
        uses: actions/upload-artifact@v4
        with:
          name: CodeLab-Offline-Packs
          path: artifact-out/packs/
          if-no-files-found: error
          retention-days: 90
      - name: Verify Reimagined test APK preserves upgrade signing
        if: github.event_name == 'pull_request' && contains(fromJSON('["reimagined-2.0","reimagined-2.1-refinement"]'), github.head_ref) && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-signing-baseline
          gh release download latest --pattern CodeLab.apk --dir test-signing-baseline
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          signer_sha256() {
            "$signer" verify --print-certs "$1" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1
          }
          existing="$(signer_sha256 test-signing-baseline/CodeLab.apk)"
          candidate="$(signer_sha256 artifact-out/app/CodeLab.apk)"
          printf 'Test APK version code: %s\nAPK SHA-256: %s\nSigning certificate: %s\n' \
            "$CODELAB_VERSION_CODE" "$(sha256sum artifact-out/app/CodeLab.apk | cut -d' ' -f1)" "$candidate" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CODELAB_SIGNING_MODE" != production || -z "$existing" || "$candidate" != "$existing" ]]; then
            echo "::error::The test APK does not match the existing CodeLab release signing certificate."
            exit 1
          fi
          for pack in artifact-out/packs/CodeLab-*.apk; do
            if [[ "$(signer_sha256 "$pack")" != "$candidate" ]]; then
              echo "::error::Runtime pack signer differs from the CodeLab APK: $pack"
              exit 1
            fi
          done
      - name: Prepare installable release APK and checksum
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true))
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/CodeLab.apk
          cp engine-python/build/outputs/apk/release/engine-python-release.apk release/CodeLab-Python.apk
          cp engine-js/build/outputs/apk/release/engine-js-release.apk release/CodeLab-JavaScript.apk
          cp engine-lua/build/outputs/apk/release/engine-lua-release.apk release/CodeLab-Lua.apk
          cp engine-java/build/outputs/apk/release/engine-java-release.apk release/CodeLab-Java.apk
          cp engine-ts/build/outputs/apk/release/engine-ts-release.apk release/CodeLab-TypeScript.apk
          cp engine-sql/build/outputs/apk/release/engine-sql-release.apk release/CodeLab-SQLite.apk
          (cd release && sha256sum CodeLab.apk CodeLab-Python.apk CodeLab-JavaScript.apk CodeLab-Lua.apk CodeLab-Java.apk CodeLab-TypeScript.apk CodeLab-SQLite.apk > CodeLab.apk.sha256)
          printf 'Build commit: %s\nVersion code: %s\nSigning mode: %s\nSigner SHA-256: %s\nUpgrade compatibility: %s\nProduction upgrade QA: %s\n' \
            "$GITHUB_SHA" "$CODELAB_VERSION_CODE" "$CODELAB_SIGNING_MODE" \
            "$CODELAB_SIGNER_SHA256" "$CODELAB_UPGRADE_COMPATIBILITY" "$CODELAB_UPGRADE_TEST" > release/CodeLab-build-info.txt
      - name: Require same-commit Android device smoke success
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true))
        timeout-minutes: 43
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 qa/require_device_smoke.py
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeLab-CI-Reports
          path: |
            app/build/reports/jacoco/
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            qa-results/
          if-no-files-found: warn
      - name: Require complete production acceptance ledger
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true))
        run: python3 qa/require_release_acceptance.py
      - name: Publish latest APK
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$(cat <<'EOF'
          ## What's new

          - Redesigned Home and Projects screens.
          - Compact editor, improved file tabs and keyboard controls.
          - Offline and Online selection when running code.
          - Integrated console and split workspace.
          - Code, result and combined snippet exports with full-file capture.
          - Refined language icons, navigation and Light/Dark appearance.

          ## Installation

          Download **CodeLab.apk** for Android 8.0 or later. Optional offline runtime packs are available below; install only the languages you need. Python requires a 64-bit device.

          Back up important projects before updating.

          [Installation guide](https://github.com/iamlxwis/CodeLab/blob/main/docs/INSTALLATION.md) · [Changelog](https://github.com/iamlxwis/CodeLab/blob/main/CHANGELOG.md)
          EOF
          )"
          NOTES="$NOTES"$'\n\n'"Build: \`$GITHUB_SHA\`"
          if [[ "$CODELAB_UPGRADE_COMPATIBILITY" == "signature_changed" ]]; then
            NOTES="$NOTES IMPORTANT: The signing certificate changed since the previous release. Android may reject this APK over an existing CodeLab installation. Export project ZIPs while the old app still works and save them outside the app. Only then uninstall, install CodeLab.apk and import the backups. There is no safe bypass for Android's signature check."
          fi
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest release/CodeLab.apk release/CodeLab-Python.apk release/CodeLab-JavaScript.apk release/CodeLab-Lua.apk release/CodeLab-Java.apk release/CodeLab-TypeScript.apk release/CodeLab-SQLite.apk release/CodeLab.apk.sha256 release/CodeLab-build-info.txt --clobber
            gh release edit latest --latest --title "CodeLab — Reimagined 2.1" --notes "$NOTES" --target "$GITHUB_SHA"
            # The 'latest' release is intentionally mutable; keep its tag
            # pointing to the source that actually produced the APK assets.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh release create latest release/CodeLab.apk release/CodeLab-Python.apk release/CodeLab-JavaScript.apk release/CodeLab-Lua.apk release/CodeLab-Java.apk release/CodeLab-TypeScript.apk release/CodeLab-SQLite.apk release/CodeLab.apk.sha256 release/CodeLab-build-info.txt --target "$GITHUB_SHA" --title "CodeLab — Reimagined 2.1" --notes "$NOTES" --latest
          fi
          # Keep the legacy latest tag for installed clients, and create a
          # separate versioned release with the exact same verified assets.
          VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo "::error::Invalid app version"; exit 1; }
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            TAG="$TAG-build.$CODELAB_VERSION_CODE"
          fi
          gh release create "$TAG" release/CodeLab.apk release/CodeLab-Python.apk release/CodeLab-JavaScript.apk release/CodeLab-Lua.apk release/CodeLab-Java.apk release/CodeLab-TypeScript.apk release/CodeLab-SQLite.apk release/CodeLab.apk.sha256 release/CodeLab-build-info.txt --target "$GITHUB_SHA" --title "CodeLab — Reimagined 2.1" --notes "$NOTES" --latest
