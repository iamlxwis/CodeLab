name: Android APK
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Checkout is read-only; never persist a token that could commit as github-actions[bot].
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure optional stable release signing
        env:
          CODELAB_KEYSTORE_B64: ${{ secrets.CODELAB_KEYSTORE_B64 }}
          CODELAB_KEYSTORE_PASSWORD: ${{ secrets.CODELAB_KEYSTORE_PASSWORD }}
          CODELAB_KEY_ALIAS: ${{ secrets.CODELAB_KEY_ALIAS }}
          CODELAB_KEY_PASSWORD: ${{ secrets.CODELAB_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CODELAB_KEYSTORE_B64" && -n "$CODELAB_KEYSTORE_PASSWORD" && -n "$CODELAB_KEY_ALIAS" && -n "$CODELAB_KEY_PASSWORD" ]]; then
            echo "$CODELAB_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/codelab-release.jks"
            echo "CODELAB_KEYSTORE_FILE=$RUNNER_TEMP/codelab-release.jks" >> "$GITHUB_ENV"
            echo "CODELAB_SIGNING_MODE=production" >> "$GITHUB_ENV"
          else
            echo "CODELAB_SIGNING_MODE=fallback-debug" >> "$GITHUB_ENV"
          fi
      - name: Static security regression gate
        run: python3 qa/security_gate.py
      - name: Build release, test, lint, and coverage report
        run: bash gradlew --no-daemon :app:assembleRelease :engine-python:assembleRelease :app:testDebugUnitTest :app:debugUnitTestCoverage :app:lintDebug
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeLab-quality-reports
          path: |
            app/build/reports/jacoco/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk'
      - name: Verify Python companion signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose engine-python/build/outputs/apk/release/engine-python-release.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: CodeLab-Python-module
          path: engine-python/build/outputs/apk/release/engine-python-release.apk
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: CodeLab-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Prepare installable release APK and checksum
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/CodeLab.apk
          cp engine-python/build/outputs/apk/release/engine-python-release.apk release/CodeLab-Python.apk
          sha256sum release/CodeLab.apk release/CodeLab-Python.apk > release/CodeLab.apk.sha256
      - name: Publish latest APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CODELAB_SIGNING_MODE" == "production" ]]; then
            NOTES="Editor APK plus separately installable signed Python module. Install Python only if you need offline Python. Both use the configured stable signing key. Python pack requires a 64-bit device. Android 8.0+. Checksums included."
          else
            NOTES="Editor APK plus optional Python module. Both are CI fallback-debug signed and must come from the SAME build; cross-release in-place updates are not guaranteed. Back up projects. Python pack requires arm64 or x86_64. Android 8.0+. Checksums included."
          fi
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest release/CodeLab.apk release/CodeLab-Python.apk release/CodeLab.apk.sha256 --clobber
            gh release edit latest --latest --title "CodeLab — latest Android APK" --notes "$NOTES"
          else
            gh release create latest release/CodeLab.apk release/CodeLab-Python.apk release/CodeLab.apk.sha256 --target "$GITHUB_SHA" --title "CodeLab — latest Android APK" --notes "$NOTES" --latest
          fi
