name: Android APK
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew --no-daemon :app:assembleDebug
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: CodeLab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
      - run: bash gradlew --no-daemon :app:testDebugUnitTest
      - name: Prepare directly installable APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/CodeLab.apk
          sha256sum release/CodeLab.apk > release/CodeLab.apk.sha256
      - name: Publish public APK download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest release/CodeLab.apk release/CodeLab.apk.sha256 --clobber
            gh release edit latest --latest --title "CodeLab — latest Android APK" --notes "Latest CI-verified Android debug APK from main. Android 8.0+. No signup required. This is an early-access debug build, not a production-signed release. Back up projects before updating. SHA256 provided alongside the APK."
          else
            gh release create latest release/CodeLab.apk release/CodeLab.apk.sha256 --target "${GITHUB_SHA}" --title "CodeLab — latest Android APK" --notes "Latest CI-verified Android debug APK from main. Android 8.0+. No signup required. This is an early-access debug build, not a production-signed release. Back up projects before updating. SHA256 provided alongside the APK." --latest
          fi
