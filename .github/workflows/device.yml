name: Android device smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: device-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # Checkout is read-only; never persist a token that could commit as github-actions[bot].
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android and runtime APKs (retry Maven 429 only)
        shell: bash
        run: |
          set -euo pipefail
          # Recheck only transient Maven Central throttling; never mask real Gradle failures.
          for attempt in 1 2 3; do
            if bash gradlew --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :engine-python:assembleDebug :engine-js:assembleDebug :engine-lua:assembleDebug :engine-java:assembleDebug :engine-ts:assembleDebug :engine-sql:assembleDebug --stacktrace > gradle-device-build.log 2>&1; then
              cat gradle-device-build.log
              exit 0
            fi
            cat gradle-device-build.log
            if ! grep -Eiq 'status code 429|HTTP 429|Too Many Requests' gradle-device-build.log; then
              exit 1
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Maven server returned HTTP 429 after three attempts."
              exit 1
            fi
            echo "::warning::Maven repository HTTP 429 on attempt $attempt/3; retrying with backoff."
            sleep $((attempt * 40))
          done
      - name: Verify packaged TypeScript compiler before Android boot
        run: node qa/typescript_compiler_smoke.js engine-ts/build/outputs/apk/debug/engine-ts-debug.apk
      - name: Release build memory before booting Android
        run: |
          bash gradlew --stop
          free -m
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -feature -Vulkan
          disable-animations: true
          script: python3 qa/device_suite.py
      - name: Capture host diagnostics after device verification
        if: always()
        run: |
          mkdir -p qa-results
          free -m > qa-results/host-memory.txt
          df -h > qa-results/host-disk.txt
          ps -eo pid,rss,comm --sort=-rss > qa-results/host-processes.txt
          if sudo dmesg > qa-results/host-kernel.txt 2>&1; then
            tail -160 qa-results/host-kernel.txt > qa-results/host-kernel-tail.txt
            rm qa-results/host-kernel.txt
          else
            mv qa-results/host-kernel.txt qa-results/host-kernel-unavailable.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-smoke-evidence-api-35
          path: |
            qa-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
