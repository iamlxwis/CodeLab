name: Android device smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: device-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # Checkout is read-only; never persist a token that could commit as github-actions[bot].
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android and runtime APKs (retry Maven 429 only)
        shell: bash
        run: |
          set -euo pipefail
          # Recheck only transient Maven Central throttling; never mask real Gradle failures.
          for attempt in 1 2 3; do
            if bash gradlew :app:assembleDebug :app:assembleRelease :engine-python:assembleDebug :engine-js:assembleDebug :engine-lua:assembleDebug :engine-java:assembleDebug :engine-ts:assembleDebug :engine-sql:assembleDebug --stacktrace > gradle-device-build.log 2>&1; then
              cat gradle-device-build.log
              exit 0
            fi
            cat gradle-device-build.log
            if ! grep -Eiq 'status code 429|HTTP 429|Too Many Requests' gradle-device-build.log; then
              exit 1
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Maven server returned HTTP 429 after three attempts."
              exit 1
            fi
            echo "::warning::Maven repository HTTP 429 on attempt $attempt/3; retrying with backoff."
            sleep $((attempt * 40))
          done
      - name: Verify packaged TypeScript compiler before Android boot
        run: node qa/typescript_compiler_smoke.js engine-ts/build/outputs/apk/debug/engine-ts-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            python3 qa/clean_install_smoke.py
            python3 qa/tutorial_resume_smoke.py
            python3 qa/missing_python_smoke.py
            python3 qa/device_smoke.py
            bash gradlew :app:connectedDebugAndroidTest
            python3 qa/performance_smoke.py
            python3 qa/motion_smoke.py
            python3 qa/accessibility_audit.py
            python3 qa/font_scale_smoke.py
            python3 qa/layout_screenshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-smoke-evidence-api-35
          path: |
            qa-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
